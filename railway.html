      if(h){posAt(h.path,h.s,_o);sim.marks.push({x:_o.x,y:_o.y,r:0.3,col:'#f2c14e'});hint='Click to place a station here';}
      else hint='Click on track to place a station';break;}
    case'train':{
      const h=pickPath(wx,wy,0.7,true);
      if(h){
        const r=buildTrainAt(sim.trainSpec,h.path,h.s,sim.trainFlip?-1:1);
        if(r.err)sim.ghost={type:'train',t:ghostStub(h),err:r.err};
        else{const err=trainFits(r.t);sim.ghost={type:'train',t:r.t,err};}
        hint=(sim.ghost.err||'Click to place the train (head at the arrow)')+'  •  R reverses facing';
      }else hint='Click on track to place the train';break;}
    case'glue':{
      const h=pickPath(wx,wy,0.4);
      if(h){sim.markPiece=h.path.piece;sim.markCol=h.path.piece.glued?'#ff9f1a':'#3ddc84';
        hint=h.path.piece.glued?'Click to unglue this piece so it can be edited':'Click to glue (nail) this piece down';}
      else hint='Click loose track to glue it. Shift+G glues everything.';break;}
    case'delete':{
      const t=trainAt(wx,wy);
      if(t){sim.marks.push({x:t.poses[0].x,y:t.poses[0].y,r:0.5,col:'#ff4d4d'});hint='Click to remove '+t.name;break;}
      const s=signalAt(wx,wy);if(s){const m=signalPos(s);sim.marks.push({x:m[0],y:m[1],r:0.3,col:'#ff4d4d'});hint='Click to remove signal';break;}
      const j=jointAt(wx,wy);if(j){const e=W.nodeMap.get(j)[0];sim.marks.push({x:e.x,y:e.y,r:0.3,col:'#ff4d4d'});hint='Remove joint';break;}
      const b=bufferAt(wx,wy);if(b){sim.marks.push({x:b.x,y:b.y,r:0.3,col:'#ff4d4d'});hint='Remove buffer stop';break;}
      const st=stationAt(wx,wy);if(st){posAt(st.path,st.s,_o);sim.marks.push({x:_o.x,y:_o.y,r:0.5,col:'#ff4d4d'});hint='Remove '+st.name;break;}
      const h=pickPath(wx,wy,0.3);
      if(h){sim.markPiece=h.path.piece;sim.markCol='#ff4d4d';hint='Click to delete this track piece';}
      else hint='Click something to delete it';break;}
    default:{
      const t=trainAt(wx,wy);
      if(t){hint=t.name+' – click to select';break;}
      const s=signalAt(wx,wy);if(s){hint='Click to hold/release this signal';break;}
      const h=pickPath(wx,wy,0.3);
      if(h&&h.path.piece.turnout){sim.markPiece=h.path.piece;sim.markCol='#ffb52e';hint='Click to throw the turnout';}
      else hint='Drag to pan, wheel/pinch to zoom';}
  }
  $('sHint').textContent=hint;
}
function ghostStub(h){      // a tiny single-car placeholder so the red ghost can be drawn
  const t=newTrain({loco:'none',coach:1});
  const back=walkFrom(h.path,h.s,-1,t.L)||[{path:h.path,dir:-1,a:h.s,b:Math.max(0,h.s-t.L)}];
  t.trail=back.map(flipEntry);updateGeometry(t);return t;
}

/* ---- click handling ------------------------------------------------ */
function onClick(wx,wy){
  switch(sim.tool){
    case'select':{
      const t=trainAt(wx,wy);
      if(t){sim.sel={type:'train',id:t.id};ui.dirty=true;ui.rebuildPanel=true;return;}
      const s=signalAt(wx,wy);
      if(s){s.hold=!s.hold;toast(s.hold?'Signal held at danger':'Signal released (automatic)');return;}
      const st=stationAt(wx,wy);
      if(st){sim.sel={type:'station',id:st.id};ui.rebuildPanel=true;return;}
      const h=pickPath(wx,wy,0.3);
      if(h&&h.path.piece.turnout){toggleTurnout(h.path.piece);return;}
      if(sim.sel){sim.sel=null;ui.rebuildPanel=true;}
      return;}
    case'track':case'turnout':{
      const g=computePieceGhost(wx,wy);
      if(!g.ok){
        const h=pickPath(wx,wy,0.3);
        if(h&&h.path.piece.turnout){toggleTurnout(h.path.piece);return;}
        toast(g.why);return;}
      pushUndo();addPiece(g.ptype,g.rot,g.mir,g.ox,g.oy,0,null,false);   // new track is LOOSE until glued
      sim.rot=g.rot;sim.mir=g.mir;
      rebuild();afterEdit();updateHover(wx,wy);return;}
    case'signal':{
      const h=pickPath(wx,wy,0.7);if(!h)return;
      const e=nearestEnd(h.path.piece,wx,wy,false);
      pushUndo();if(toggleSignal(e.piece,e.idx))afterEdit();else UNDO.pop();
      updateHover(wx,wy);return;}
    case'joint':{
      const h=pickPath(wx,wy,0.7);if(!h)return;
      const e=nearestEnd(h.path.piece,wx,wy,true);if(!e)return;
      pushUndo();if(toggleJoint(e.x,e.y))afterEdit();else UNDO.pop();
      updateHover(wx,wy);return;}
    case'buffer':{
      const e=openEndNear(wx,wy,1.0)||bufferAt(wx,wy);if(!e)return;
      pushUndo();if(toggleBuffer(e))afterEdit();else UNDO.pop();
      updateHover(wx,wy);return;}
    case'station':{
      const h=pickPath(wx,wy,0.6);if(!h)return;
      pushUndo();const st=addStation(h.path,h.s);afterEdit();
      sim.sel={type:'station',id:st.id};ui.rebuildPanel=true;return;}
    case'train':{
      const h=pickPath(wx,wy,0.7,true);if(!h){toast('Trains can only be placed on glued track');return;}
      const r=buildTrainAt(sim.trainSpec,h.path,h.s,sim.trainFlip?-1:1);
      if(r.err){toast(r.err);return;}
      const err=trainFits(r.t);if(err){toast(err);return;}
      pushUndo();
      const t=registerTrain(r.t);t.mode=sim.trainSpec.mode;
      if(sim.started&&baseline){const b=JSON.parse(baseline);b.trains.push(serTrain(t));baseline=JSON.stringify(b);}
      else afterEdit();
      sim.sel={type:'train',id:t.id};ui.rebuildPanel=true;
      updateHover(wx,wy);return;}
    case'glue':{
      const h=pickPath(wx,wy,0.4);if(!h)return;
      const p=h.path.piece;pushUndo();
      if(setGlue(p,!p.glued)){afterEdit();toast(p.glued?'Glued':'Unglued – drag its end handles to reshape');}else UNDO.pop();
      updateHover(wx,wy);return;}
    case'delete':{
      const t=trainAt(wx,wy);
      if(t){pushUndo();W.trains=W.trains.filter(x=>x!==t);if(sim.sel&&sim.sel.id===t.id&&sim.sel.type==='train')sim.sel=null;afterEdit();ui.rebuildPanel=true;return;}
      const s=signalAt(wx,wy);
      if(s){pushUndo();W.signals=W.signals.filter(x=>x!==s);rebuild();afterEdit();return;}
      const j=jointAt(wx,wy);
      if(j){pushUndo();W.joints=W.joints.filter(x=>x!==j);rebuild();afterEdit();return;}
      const b=bufferAt(wx,wy);
      if(b){pushUndo();b.buffer=false;rebuild();afterEdit();return;}
      const st=stationAt(wx,wy);
      if(st){pushUndo();W.stations=W.stations.filter(x=>x!==st);for(const t of W.trains)t.tt.stops=t.tt.stops.filter(x=>x.st!==st.id);
        if(sim.sel&&sim.sel.type==='station')sim.sel=null;rebuild();afterEdit();ui.rebuildPanel=true;return;}
      const h=pickPath(wx,wy,0.3);
      if(h){pushUndo();removePiece(h.path.piece);afterEdit();sim.markPiece=null;updateHover(wx,wy);}
      return;}
  }
}

/* ---- pointer events: pan / pinch / click --------------------------- */
const ptrs=new Map();let down=null;
function evPos(e){const r=cvs.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cvs.addEventListener('contextmenu',e=>e.preventDefault());
cvs.addEventListener('pointerdown',e=>{
  try{cvs.setPointerCapture(e.pointerId);}catch(err){}
  const p=evPos(e);ptrs.set(e.pointerId,{x:p.x,y:p.y});
  if(ptrs.size===1){
    down={x:p.x,y:p.y,btn:e.button,moved:false,cx:cam.x,cy:cam.y,type:e.pointerType,pinch:false};
    if(e.button===1||e.button===2)down.moved=true;   // middle / right drag pans immediately
    else if(e.button===0&&!menuOpen){
      const[wx,wy]=s2w(p.x,p.y);
      const h=(sim.tool==='select'||sim.tool==='track')?handleAt(wx,wy):null;
      if(h){down.mode='resize';down.E=h;}                 // grab an end of loose track
      else if(isLineTool())down.mode='draw';              // drag to lay a straight run
    }
  }else if(ptrs.size===2){
    const[a,b]=[...ptrs.values()];
    if(DRAG&&DRAG.kind==='draw'){DRAG=null;sim.dragPreview=null;}
    if(DRAG&&DRAG.kind==='resize')finishDrag();
    down=down||{};down.mode=null;down.pinch=true;down.moved=true;
    down.d0=Math.hypot(a.x-b.x,a.y-b.y)||1;down.z0=cam.z;down.mx=(a.x+b.x)/2;down.my=(a.y+b.y)/2;
    down.cx=cam.x;down.cy=cam.y;
  }
});
cvs.addEventListener('pointermove',e=>{
  const p=evPos(e);
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:p.x,y:p.y});
  if(down&&down.pinch&&ptrs.size>=2){
    const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const wasZ=cam.z;cam.z=clamp(down.z0*d/down.d0,8,140);
    // keep the world point under the pinch centre fixed
    const wx0=(down.mx-vw/2)/down.z0+down.cx,wy0=(down.my-vh/2)/down.z0+down.cy;
    cam.x=wx0-(mx-vw/2)/cam.z;cam.y=wy0-(my-vh/2)/cam.z;
    return;
  }
  if(down&&ptrs.has(e.pointerId)&&ptrs.size===1){
    const dx=p.x-down.x,dy=p.y-down.y;
    if(!down.moved&&Math.hypot(dx,dy)>(down.type==='touch'?9:5))down.moved=true;
    if(down.moved&&down.mode){
      const[wx,wy]=s2w(p.x,p.y);
      if(!DRAG){down.mode==='resize'?startResize(down.E):startDraw(...s2w(down.x,down.y));}
      if(DRAG)DRAG.kind==='resize'?updateResize(wx,wy):updateDraw(wx,wy);
    }else if(down.moved){cam.x=down.cx-dx/cam.z;cam.y=down.cy-dy/cam.z;{const st=selTrain();if(st&&st.follow){st.follow=false;ui.dirty=true;}}}
  }
  if(e.pointerType!=='touch'&&!(down&&down.moved)){const[wx,wy]=s2w(p.x,p.y);updateHover(wx,wy);}
});
function endPointer(e,cancel){
  const p=evPos(e);
  const wasDown=down;
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){
    if(DRAG){if(cancel&&DRAG.kind==='draw'){DRAG=null;sim.dragPreview=null;}else finishDrag();}
    else if(wasDown&&!wasDown.moved&&!wasDown.pinch&&!cancel&&wasDown.btn===0){
      const[wx,wy]=s2w(p.x,p.y);
      if(e.pointerType==='touch')updateHover(wx,wy);
      onClick(wx,wy);
    }
    down=null;
  }else if(ptrs.size===1){            // pinch -> single finger: restart pan from here without clicking
    const[q]=[...ptrs.values()];
    down={x:q.x,y:q.y,btn:0,moved:true,cx:cam.x,cy:cam.y,type:'touch',pinch:false};
  }
}
cvs.addEventListener('pointerup',e=>endPointer(e,false));
cvs.addEventListener('pointercancel',e=>endPointer(e,true));
cvs.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch'){sim.ghost=null;sim.marks=[];sim.markPiece=null;}});
cvs.addEventListener('wheel',e=>{
  e.preventDefault();
  const p=evPos(e),before=s2w(p.x,p.y);
  const f=Math.exp(-e.deltaY*(e.deltaMode===1?0.04:0.0015));
  cam.z=clamp(cam.z*f,8,140);
  const after=s2w(p.x,p.y);cam.x+=before[0]-after[0];cam.y+=before[1]-after[1];
},{passive:false});

/* ---- keyboard ------------------------------------------------------ */
const TOOLKEYS={v:'select',t:'track',u:'turnout',s:'signal',j:'joint',b:'buffer',n:'station',a:'train',d:'delete',g:'glue'};
let brakeHeld=null;
function selTrain(){return sim.sel&&sim.sel.type==='train'?W.trains.find(t=>t.id===sim.sel.id)||null:null;}
function setThrottle(t,v){t.throttle=clamp(v,0,1);if(t.mode!=='manual')t.mode='manual';ui.dirty=true;}
function cycleTrain(dir){
  if(!W.trains.length)return;
  const i=W.trains.findIndex(t=>sim.sel&&sim.sel.type==='train'&&t.id===sim.sel.id);
  const t=W.trains[(i+dir+W.trains.length*2)%W.trains.length];
  sim.sel={type:'train',id:t.id};ui.rebuildPanel=true;
}
window.addEventListener('keydown',e=>{
  if(e.target&&/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)&&e.key!=='Escape')return;
  if(menuOpen)return;
  const k=e.key.toLowerCase();
  if(e.ctrlKey||e.metaKey){
    if(k==='z'){e.preventDefault();undo();}
    else if(k==='s'){e.preventDefault();saveLocal();}
    return;
  }
  const t=selTrain();
  if(e.key===' '){e.preventDefault();if(t&&brakeHeld===null){brakeHeld=t.brake;t.brake=1;ui.dirty=true;}return;}
  if(e.key==='ArrowUp'&&!e.shiftKey){e.preventDefault();if(t)setThrottle(t,Math.round(t.throttle*10)/10+0.1);return;}
  if(e.key==='ArrowDown'&&!e.shiftKey){e.preventDefault();if(t)setThrottle(t,Math.round(t.throttle*10)/10-0.1);return;}
  if(e.shiftKey&&e.key.startsWith('Arrow')){
    const s=60/cam.z;if(e.key==='ArrowUp')cam.y-=s;if(e.key==='ArrowDown')cam.y+=s;
    if(e.key==='ArrowLeft')cam.x-=s;if(e.key==='ArrowRight')cam.x+=s;e.preventDefault();return;
  }
  if(k==='g'&&e.shiftKey){doGlueAll();return;}
  if(TOOLKEYS[k]){ui.setTool(TOOLKEYS[k]);return;}
  switch(k){
    case'r':sim.rot=(sim.rot+(e.shiftKey?7:1))&7;if(sim.tool==='train'){sim.trainFlip=!sim.trainFlip;}refreshGhost();break;
    case'f':sim.mir^=1;refreshGhost();break;
    case'p':ui.togglePause();break;
    case'1':ui.setSpeed(1);break;case'2':ui.setSpeed(2);break;case'3':ui.setSpeed(5);break;
    case'0':resetSim();break;
    case'l':ui.toggleBlocks();break;
    case'k':ui.toggleNight();break;
    case'm':sndToggle();break;
    case'o':if(t)sndHorn(t);break;
    case'h':case'?':ui.toggleHelp();break;
    case'x':if(t)emergencyStop(t);break;
    case'c':if(t)reverseTrain(t);break;
    case'tab':e.preventDefault();cycleTrain(e.shiftKey?-1:1);break;
    case'escape':
      if($('help').classList.contains('show')){ui.toggleHelp();break;}
      if(DRAG&&DRAG.kind==='draw'){DRAG=null;sim.dragPreview=null;break;}
      sim.sel=null;ui.rebuildPanel=true;if(sim.tool!=='select')ui.setTool('select');break;
    case'delete':case'backspace':
      if(t){pushUndo();W.trains=W.trains.filter(x=>x!==t);sim.sel=null;afterEdit();ui.rebuildPanel=true;}break;
    case'+':case'=':cam.z=clamp(cam.z*1.2,8,140);break;
    case'-':case'_':cam.z=clamp(cam.z/1.2,8,140);break;
  }
});
window.addEventListener('keyup',e=>{
  if(e.key===' '&&brakeHeld!==null){const t=selTrain();if(t){t.brake=brakeHeld;ui.dirty=true;}brakeHeld=null;}
});

/* =====================================================================
   9b. DRAG TO LAY / DRAG TO RESIZE LOOSE TRACK
   Track tool with Straight/Diagonal selected: press and drag to lay a run
   of straight pieces from the start point to the cursor (snapped to the 8
   directions); the run stops at the first obstacle.  Loose straight track
   shows amber handles on its open ends: drag one to lengthen/shorten the
   run (a run with a free far end can also be swung to a new direction).
   ===================================================================== */
const isLineTool=()=>sim.tool==='track'&&(sim.piece==='straight'||sim.piece==='diag');
const dirFromVec=(dx,dy)=>(((Math.round(Math.atan2(dy,dx)/(Math.PI/4)))%8)+8)%8;
// How many straight pieces starting at node S heading d can be laid before something is in the way?
function chainFor(S,d,n){
  let k=0,why='';
  for(let i=0;i<n;i++){
    const c=checkPlacement('straight',d,0,S[0]+DV[d][0]*i,S[1]+DV[d][1]*i);
    if(!c.ok){why=c.why;break;}k++;
  }
  return{k,why};
}
function pieceCount(S,d,dx,dy){const v=DV[d];return Math.round((dx*v[0]+dy*v[1])/(v[0]*v[0]+v[1]*v[1]));}
function handleAt(wx,wy){
  for(const p of W.pieces)if(!p.glued&&p.type==='straight')for(const e of p.ends)
    if(!e.elink&&Math.hypot(e.x-wx,e.y-wy)<0.4)return e;
  return null;
}
function startDraw(wx,wy){
  const e=openEndNear(wx,wy,1.0);
  DRAG={kind:'draw',S:e?[e.x,e.y]:[Math.round(wx),Math.round(wy)],lock:e?e.d:null,linked:!!e};
}
function updateDraw(wx,wy){
  const S=DRAG.S,dx=wx-S[0],dy=wy-S[1];
  if(DRAG.lock===null&&Math.hypot(dx,dy)<0.6){sim.dragPreview={S,d:0,k:0,n:0};return;}
  const d=DRAG.lock!==null?DRAG.lock:dirFromVec(dx,dy),n=Math.max(0,pieceCount(S,d,dx,dy));
  const r=chainFor(S,d,n);
  DRAG.d=d;DRAG.k=r.k;
  sim.dragPreview={S,d,k:r.k,n,why:r.why,linked:DRAG.linked};
}
// The run of loose straight pieces ending at open end E (stops at anything that isn't loose straight track).
function looseRun(E){
  const P=E.piece;if(P.type!=='straight'||P.glued)return null;
  const run=[P];let entry=P.ends.find(e=>e!==E);
  while(entry.elink&&entry.elink.piece.type==='straight'&&!entry.elink.piece.glued&&!run.includes(entry.elink.piece)){
    const nb=entry.elink.piece;run.unshift(nb);entry=nb.ends.find(e=>e!==entry.elink);
  }
  return{S:[entry.x,entry.y],d:E.d,free:!entry.elink,pieces:run};
}
function startResize(E){
  const r=looseRun(E);if(!r){DRAG=null;return;}
  pushUndo();
  DRAG={kind:'resize',S:r.S,d:r.d,free:r.free,pieces:r.pieces,n:r.pieces.length,changed:false};
}
function updateResize(wx,wy){
  const S=DRAG.S,dx=wx-S[0],dy=wy-S[1];
  let d=DRAG.d;
  if(DRAG.free&&Math.hypot(dx,dy)>=0.6)d=dirFromVec(dx,dy);
  const n=Math.max(1,pieceCount(S,d,dx,dy));
  if(d===DRAG.d&&n===DRAG.n)return;
  // take the run out, see how many pieces fit the new target, then lay them again
  const old=DRAG.pieces;
  W.pieces=W.pieces.filter(p=>!old.includes(p));rebuild(true);
  let r=chainFor(S,d,n);
  if(r.k<1){d=DRAG.d;r=chainFor(S,d,DRAG.n);}       // nothing fits: keep the previous shape
  const made=[];
  for(let i=0;i<r.k;i++)made.push(addPiece('straight',d,0,S[0]+DV[d][0]*i,S[1]+DV[d][1]*i,0,null,false));
  rebuild();
  DRAG.pieces=made;DRAG.d=d;DRAG.n=made.length;DRAG.changed=true;
  $('sHint').textContent=made.length+' piece'+(made.length>1?'s':'')+(r.k<n?' – blocked: '+r.why:'');
}
function finishDrag(){
  const D=DRAG;DRAG=null;sim.dragPreview=null;if(!D)return;
  if(D.kind==='draw'){
    if(!D.k)return;
    pushUndo();
    for(let i=0;i<D.k;i++)addPiece('straight',D.d,0,D.S[0]+DV[D.d][0]*i,D.S[1]+DV[D.d][1]*i,0,null,false);
    rebuild();afterEdit();
    toast('Laid '+D.k+' loose piece'+(D.k>1?'s':'')+' – drag an end handle to resize, then glue (G)');
  }else{
    if(D.changed)afterEdit();else UNDO.pop();
  }
  ui.dirty=true;
}
function doGlueAll(){
  pushUndo();const n=glueAll();
  if(n){afterEdit();toast('Glued '+n+' piece'+(n>1?'s':''));}else{UNDO.pop();toast('Nothing loose to glue');}
}

const hm=s=>s==null?'':pad(Math.floor(s/3600)%24)+':'+pad(Math.floor(s/60)%60);
const parseHM=v=>{if(!v)return null;const[h,m]=v.split(':').map(Number);return h*3600+m*60;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){

}

function liveTrain(t){
  setVal('pState',t.state);

  setVal('pDir',(t.rev?'Reverse':'Forward')+' · heading '+DNAME[((Math.round(a/(Math.PI/4))%8)+8)%8]);
  setVal('pBd',t.powered?(t.v*t.v/(2*t.bdec)).toFixed(1)+' cells (now) · '+(t.vmax*t.vmax/(2*t.bdec)).toFixed(1)+' at top speed':'–');

   11. EXAMPLE LAYOUTS (built with a small "turtle" that lays connected track)
   ===================================================================== */
function clearWorld(){
  W.pieces=[];W.signals=[];W.joints=[];W.stations=[];W.trains=[];W.crashes=[];W.sep.clear();
  W.nextId=1;W.nextSig=1;W.nextSt=1;W.nextTrain=1;W.clock=8*3600;sim.sel=null;sim.started=false;
  rebuild(true);
}
function Builder(){
  const B={x:0,y:0,h:0,last:null};
  B.at=(x,y,h)=>{B.x=x;B.y=y;B.h=h;B.last=null;return B;};
  // Place `type` so that its `entry` end sits at the turtle facing the way we travel; the turtle
  // then moves to the `exit` end.  `turn` checks the exit heading change in 45° steps.
  B.put=(type,entry,exit,turn,mir)=>{
    for(let rot=0;rot<8;rot++)for(let m=0;m<2;m++){
      if(mir!==undefined&&m!==mir)continue;
      const es=endsOf(type,rot,m,0,0),en=es[entry];
      if(en.d!==opp(B.h))continue;
      if(turn!==undefined&&es[exit].d!==((B.h+turn)&7))continue;
      const ox=B.x-en.x,oy=B.y-en.y;
      if(!checkPlacement(type,rot,m,ox,oy).ok)continue;
      const p=addPiece(type,rot,m,ox,oy,0);rebuild(true);
      B.x=p.ends[exit].x;B.y=p.ends[exit].y;B.h=p.ends[exit].d;B.last={p,exit};return p;
    }
    throw new Error('builder: cannot place '+type+' at '+B.x+','+B.y+' heading '+B.h);
  };
  B.fwd=n=>{let p;for(let i=0;i<n;i++)p=B.put('straight',0,1,0);return p;};
  B.L=()=>B.put('curve',0,1,-2);
  B.R=()=>B.put('curve',0,1,2);
  B.turnout=(side,exitIdx)=>B.put('turnout',0,exitIdx||1,undefined,side==='L'?1:0);
  B.merge=(entryIdx,mir)=>B.put('turnout',entryIdx,0,undefined,mir);
  // signals are queued and applied once both sides of the joint exist (see flush)
  B.pend=[];
  B.sig=()=>{B.pend.push([B.last.p,B.last.exit]);};
  B.sigAt=(p,e)=>{B.pend.push([p,e]);};
  B.flush=()=>{for(const[p,e]of B.pend)W.signals.push({id:W.nextSig++,pid:p.id,e,hold:false,lamp:0});B.pend.length=0;rebuild(true);};
  B.mark=()=>({p:B.last.p,exit:B.last.exit});
  B.branch=(p,exit,fn)=>{
    const s={x:B.x,y:B.y,h:B.h,last:B.last};
    B.x=p.ends[exit].x;B.y=p.ends[exit].y;B.h=p.ends[exit].d;B.last={p,exit};
    fn();Object.assign(B,s);
  };
  B.buffer=()=>{B.last.p.ends[B.last.exit].buffer=true;};
  B.station=(name,side)=>{
    rebuild();const pa=B.last.p.paths[0];
    const st=addStation(pa,pa.len/2);st.name=name;if(side)st.side=side;return st;
  };
  return B;
}
function putTrain(m,spec,extra){
  const pa=m.p.paths.find(q=>q.a===m.exit||q.b===m.exit);
  const dir=pa.b===m.exit?1:-1,s=dir>0?pa.len-0.05:0.05;
  const r=buildTrainAt(spec,pa,s,dir);
  if(r.err)throw new Error('example train: '+r.err);
  const t=registerTrain(r.t);Object.assign(t,extra||{});return t;
}

function exOval(){

  b.R();b.fwd(3);b.sig();M.push(b.mark());b.fwd(3);b.R();
  b.fwd(3);b.sig();M.push(b.mark());b.fwd(5);const stS=b.station('South');b.fwd(3);b.sig();M.push(b.mark());b.fwd(3);
  b.R();b.fwd(3);b.sig();M.push(b.mark());b.fwd(3);b.R();

function exEight(){
  clearWorld();const b=Builder(),M={};
  addPiece('crossing',0,0,9,6);rebuild(true);
  // right lobe (anticlockwise): leaves the crossing eastwards, returns from the north
  b.at(11,6,0);b.fwd(3);b.sig();b.fwd(3);b.L();b.fwd(2);b.sig();M.A=b.mark();b.fwd(3);b.L();
  b.fwd(3);b.sig();M.C=b.mark();b.fwd(3);b.L();b.fwd(2);b.sig();b.fwd(3);b.sig();
  // left lobe (clockwise) with a passing siding on the bottom run
  b.at(10,7,2);b.fwd(4);b.sig();b.fwd(1);b.R();
  const T1=b.turnout('L',1);b.fwd(2);b.sig();b.fwd(3);b.merge(1,0);M.B=b.mark();
  b.R();b.fwd(2);b.sig();M.D=b.mark();b.fwd(3);b.R();b.fwd(4);b.sig();b.fwd(5);b.sig();
  let mS;
  b.branch(T1,2,()=>{b.fwd(5);mS=b.mark();b.sig();});
  b.sigAt(T1,2);
  b.flush();rebuild();
  putTrain(mS,{loco:'none',boxcar:2},{}).name='Rake (siding)';
  putTrain(M.A,{loco:'express',coach:3},{mode:'auto'}).name='Express A';
  putTrain(M.B,{loco:'diesel',boxcar:2,tank:1},{mode:'auto'}).name='Freight B';
  putTrain(M.C,{loco:'diesel',coach:2},{mode:'auto'}).name='Local C';
  putTrain(M.D,{loco:'diesel',hopper:3},{mode:'auto'}).name='Coal D';
  cam.x=9;cam.y=7;
}

function exTerminus(){
  clearWorld();const b=Builder();
  // main line (buffer stops at both ends) with a junction; branch runs to a two-platform terminus
  b.at(2,3,0);b.fwd(4);const stH=b.station('Mainline Halt');b.fwd(5);const mW=b.mark();b.sig();
  const first=W.pieces[0];first.ends.find(e=>e.x===2&&e.y===3).buffer=true;
  const J=b.turnout('R',1);
  b.fwd(1);const east1=b.last.p;b.fwd(17);b.buffer();
  let stP1,stP2,mP2,mG;
  b.branch(J,2,()=>{
    b.R();b.fwd(2);b.L();b.fwd(1);b.sig();
    const TA=b.turnout('R',1);b.fwd(2);const TG=b.turnout('L',1);
    b.fwd(1);stP1=b.station('Terminus P1',1);b.fwd(2);b.buffer();
    b.branch(TG,2,()=>{b.fwd(3);mG=b.mark();b.buffer();});
    b.branch(TA,2,()=>{b.fwd(4);stP2=b.station('Terminus P2',1);b.fwd(3);mP2=b.mark();b.buffer();});
  });
  b.sigAt(J,0);b.sigAt(J,1);b.sigAt(J,2);b.sigAt(east1,0);
  b.flush();
  // west buffer was flagged before the end was linked-checked; re-apply after rebuild
  first.ends.find(e=>e.x===2&&e.y===3).buffer=true;rebuild();
  putTrain(mW,{loco:'express',coach:4},{mode:'auto'}).name='Mainline Express';
  putTrain(mG,{loco:'none',boxcar:3},{}).name='Goods rake';
  const bt=putTrain(mP2,{loco:'diesel',coach:2},{mode:'timetable'});bt.name='Branch Pacer';
  bt.tt.stops=[{st:stH.id,dwell:6,depart:null},{st:stP1.id,dwell:12,depart:null}];
  void stP2;
}
const EXAMPLES={oval:exOval,eight:exEight,terminus:exTerminus,twin:exTwin,blank:()=>{clearWorld();}};
function loadExample(name,silent){
  if(!silent)pushUndo();
  try{EXAMPLES[name]();}catch(err){console.error(err);toast('Example failed: '+err.message);return;}
  rebuild();computeOccupancy();
  for(const t of W.trains)updateGeometry(t);
  for(const s of W.signals)s.lamp=0;
  baseline=JSON.stringify(serialize());sim.started=false;sim.sel=null;
  fitView();ui.refresh();if(!silent)toast(name==='blank'?'Blank layout':'Loaded example: '+name);
}
function fitView(){
  if(!W.pieces.length){cam.x=10;cam.y=6;cam.z=40;return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of W.pieces){x0=Math.min(x0,p.minx);x1=Math.max(x1,p.maxx);y0=Math.min(y0,p.miny);y1=Math.max(y1,p.maxy);}
  const panelW=vw>760?330:0,availW=Math.max(200,vw-panelW),availH=vh*(vw>760?1:0.55);
  cam.z=clamp(Math.min(availW/(x1-x0+4),availH/(y1-y0+4)),14,60);
  cam.x=(x0+x1)/2+panelW/2/cam.z;cam.y=(y0+y1)/2+(vw>760?0:0.225*vh/cam.z);
}


/* =====================================================================
   11b. SOUND (WebAudio, synthesised – no files): engine rumble, rail
   clatter proportional to speed, horn, crash.  Off until enabled (M).
   ===================================================================== */
const SND={ac:null,on:false,noise:null,filt:null,eng:null,next:0};
function sndInit(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  const ac=SND.ac=new AC(),sr=ac.sampleRate,buf=ac.createBuffer(1,sr*2,sr),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  SND.noise=buf;
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  SND.filt=ac.createBiquadFilter();SND.filt.type='lowpass';SND.filt.frequency.value=120;
  SND.eng=ac.createGain();SND.eng.gain.value=0;
  src.connect(SND.filt);SND.filt.connect(SND.eng);SND.eng.connect(ac.destination);src.start();
  return true;
}
function sndToggle(){
  if(!SND.ac&&!sndInit()){toast('Audio is not available in this browser');return;}
  SND.on=!SND.on;if(SND.ac.state==='suspended')SND.ac.resume();
  $('bSound').classList.toggle('on',SND.on);if(!SND.on)SND.eng.gain.value=0;
  toast(SND.on?'Sound on (follows the selected or nearest train)':'Sound off');
}
function sndBurst(freq,q,vol,dur){
  const ac=SND.ac,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime;
  s.buffer=SND.noise;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,Math.random(),dur+0.02);
}
function sndHorn(){
  if(!SND.on)return;
  const ac=SND.ac,t=ac.currentTime,g=ac.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.09,t+0.08);g.gain.setValueAtTime(0.09,t+0.9);g.gain.linearRampToValueAtTime(0,t+1.2);
  g.connect(ac.destination);
  for(const f of[311,392]){const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(g);o.start(t);o.stop(t+1.25);}
}
function sndCrash(){if(SND.on)sndBurst(500,0.5,0.6,1.3);}
function sndUpdate(dt){
  if(!SND.on||!SND.ac)return;
  let t=selTrain();
  if(!t){let bd=1e9;for(const x of W.trains){if(x.v<0.05)continue;const p=x.poses[0];if(!p)continue;const d=Math.hypot(p.x-cam.x,p.y-cam.y);if(d<bd){bd=d;t=x;}}}
  const now=SND.ac.currentTime;
  if(!t||sim.paused||t.v<0.03){SND.eng.gain.setTargetAtTime(0,now,0.15);return;}
  const sp=t.v/(t.vmax||3);
  SND.eng.gain.setTargetAtTime(Math.min(0.22,0.04+sp*0.16),now,0.1);
  SND.filt.frequency.setTargetAtTime(90+sp*240,now,0.1);
  SND.next-=dt*Math.min(sim.speed,2);
  if(SND.next<=0&&t.v>0.12){sndBurst(1400+Math.random()*700,2,0.1+sp*0.12,0.07);SND.next=1/(t.v*1.7);}
}

/* =====================================================================
   11c. MAIN MENU & SAVE SLOTS (localStorage; each save has a thumbnail)
   ===================================================================== */
const STORE={
  IDX:'railsim.index.v2',DATA:'railsim.data.v2.',LAST:'railsim.last',
  index(){try{const a=JSON.parse(localStorage.getItem(this.IDX)||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}},
  setIndex(a){try{localStorage.setItem(this.IDX,JSON.stringify(a));return true;}catch(e){toast('Browser storage is full or blocked – use Export JSON');return false;}},
  read(id){try{return JSON.parse(localStorage.getItem(this.DATA+id));}catch(e){return null;}},
  write(id,o){try{localStorage.setItem(this.DATA+id,JSON.stringify(o));return true;}catch(e){toast('Browser storage is full or blocked – use Export JSON');return false;}},
  remove(id){try{localStorage.removeItem(this.DATA+id);}catch(e){}},
  last(){try{return localStorage.getItem(this.LAST);}catch(e){return null;}},
  setLast(id){try{localStorage.setItem(this.LAST,id);}catch(e){}}
};
let curSave=null;          // {id,name} – the slot the editor is saving into
const newId=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// Small picture of the layout for the save card.
function makeThumb(){
  const c=document.createElement('canvas');c.width=240;c.height=140;const g=c.getContext('2d');
  g.fillStyle='#4d7a3b';g.fillRect(0,0,240,140);
  if(W.pieces.length){
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const p of W.pieces){x0=Math.min(x0,p.minx);x1=Math.max(x1,p.maxx);y0=Math.min(y0,p.miny);y1=Math.max(y1,p.maxy);}
    const s=Math.min(216/Math.max(1,x1-x0),116/Math.max(1,y1-y0),30),ox=120-(x0+x1)/2*s,oy=70-(y0+y1)/2*s;
    g.lineCap='round';g.lineJoin='round';
    const line=(w,col,loose)=>{
      g.lineWidth=w;g.strokeStyle=col;
      for(const p of W.pieces)for(const pa of p.paths){
        if(!!p.glued===loose)continue;
        g.beginPath();g.moveTo(pa.xs[0]*s+ox,pa.ys[0]*s+oy);for(let i=1;i<=pa.n;i++)g.lineTo(pa.xs[i]*s+ox,pa.ys[i]*s+oy);g.stroke();
      }
    };
    line(Math.max(2.4,s*0.4),'#6a6256',false);line(Math.max(1,s*0.13),'#d3d7dc',false);
    line(Math.max(1,s*0.13),'#f2b94b',true);
    for(const t of W.trains)for(let i=0;i<t.poses.length;i++){
      const p=t.poses[i];g.fillStyle=t.cars[i].col||CARS[t.cars[i].k].color;g.fillRect(p.x*s+ox-2,p.y*s+oy-2,4,4);
    }
  }
  return c.toDataURL('image/jpeg',0.7);
}
function saveCurrent(silent){
  if(!curSave)return false;
  if(!STORE.write(curSave.id,serialize()))return false;
  const idx=STORE.index().filter(x=>x.id!==curSave.id);
  idx.unshift({id:curSave.id,name:curSave.name,updated:Date.now(),pieces:W.pieces.length,trains:W.trains.length,thumb:makeThumb()});
  STORE.setIndex(idx);STORE.setLast(curSave.id);
  if(!silent)toast('Saved "'+curSave.name+'"');
  return true;
}
function openSlot(id){
  const meta=STORE.index().find(x=>x.id===id),data=STORE.read(id);
  if(!meta||!data){toast('That save is missing or damaged');renderMenu();return;}
  try{loadLayout(data,false);}catch(e){toast('Could not open save: '+e.message);return;}
  curSave={id,name:meta.name};STORE.setLast(id);
  ui.setPaused(false);hideMenu();
}
function newSaveFromData(o,name){
  loadLayout(o,false);
  curSave={id:newId(),name:name||'Untitled'};saveCurrent(true);
  ui.setPaused(false);hideMenu();
}
function newSave(name,tpl){
  if(tpl&&tpl!=='blank')loadExample(tpl,true);else{clearWorld();rebuild();computeOccupancy();baseline=JSON.stringify(serialize());cam.x=10;cam.y=6;cam.z=40;ui.refresh();}
  UNDO.length=0;
  curSave={id:newId(),name:name||'Untitled'};saveCurrent(true);
  ui.setPaused(false);hideMenu();
  toast(tpl==='blank'||!tpl?'New blank layout – pick Track (T) and start laying':'Created "'+curSave.name+'"');
}
function renameSlot(id,name){
  const a=STORE.index(),m=a.find(x=>x.id===id);if(!m||!name)return;
  m.name=name.slice(0,40);STORE.setIndex(a);if(curSave&&curSave.id===id)curSave.name=m.name;
}
function duplicateSlot(id){
  const a=STORE.index(),m=a.find(x=>x.id===id),d=STORE.read(id);if(!m||!d)return;
  const nid=newId();if(!STORE.write(nid,d))return;
  a.unshift(Object.assign({},m,{id:nid,name:m.name+' copy',updated:Date.now()}));STORE.setIndex(a);
}
function deleteSlots(ids){
  const set=new Set(ids);
  for(const id of ids)STORE.remove(id);
  STORE.setIndex(STORE.index().filter(x=>!set.has(x.id)));
  if(curSave&&set.has(curSave.id))curSave=null;
}
function showMenu(){
  if(menuOpen)return;
  saveCurrent(true);
  menuOpen=true;ui._wasPaused=sim.paused;ui.setPaused(true);
  $('menu').classList.add('show');renderMenu();
}
function hideMenu(){
  menuOpen=false;$('menu').classList.remove('show');
  if(ui._wasPaused===false)ui.setPaused(false);
}
let selSlots=new Set(),armed=null,armTimer=0;
function arm(key,btn,label,fn){
  if(armed===key){clearTimeout(armTimer);armed=null;fn();return;}
  armed=key;btn.classList.add('armed');btn.textContent=label;
  clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;renderMenu();},3000);
}
function renderMenu(){
  const idx=STORE.index().sort((a,b)=>b.updated-a.updated),list=$('saveList');
  selSlots=new Set([...selSlots].filter(id=>idx.some(x=>x.id===id)));
  const last=STORE.last(),lm=idx.find(x=>x.id===last);
  const bc=$('mContinue');bc.style.display=lm?'':'none';if(lm)bc.textContent='▶ Continue: '+lm.name;
  $('mBack').style.display=curSave?'':'none';
  list.innerHTML=idx.length?'':'<div class="empty">No saves yet – create a new layout to get started.</div>';
  for(const m of idx){
    const d=document.createElement('div');d.className='card'+(curSave&&curSave.id===m.id?' cur':'');d.dataset.id=m.id;
    const when=new Date(m.updated).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    d.innerHTML='<input type="checkbox" data-a="sel"'+(selSlots.has(m.id)?' checked':'')+'><img alt="" src="'+(m.thumb||'')+'">'+
      '<div><div class="nm">'+esc(m.name)+'</div><div class="meta">'+when+' · '+m.pieces+' pieces · '+m.trains+' trains'+(curSave&&curSave.id===m.id?' · open':'')+'</div></div>'+
      '<div class="acts"><button data-a="open" class="on">Open</button><button data-a="ren">Rename</button><button data-a="dup">Duplicate</button><button data-a="del" class="danger">Delete</button></div>';
    list.appendChild(d);
  }
  const n=selSlots.size,ds=$('mDelSel');ds.style.display=n?'':'none';ds.textContent='Delete selected ('+n+')';ds.classList.remove('armed');
}
$('saveList').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'),card=e.target.closest('.card');if(!b||!card)return;
  const id=card.dataset.id,a=b.dataset.a;
  if(a==='open')openSlot(id);
  else if(a==='dup'){duplicateSlot(id);renderMenu();}
  else if(a==='del')arm('del:'+id,b,'Click again to delete',()=>{deleteSlots([id]);renderMenu();toast('Deleted');});
  else if(a==='ren'){
    const nm=card.querySelector('.nm'),inp=document.createElement('input');
    inp.type='text';inp.className='rn';inp.value=nm.textContent;nm.replaceWith(inp);inp.focus();inp.select();
    const done=()=>{renameSlot(id,inp.value.trim());renderMenu();};
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')done();if(ev.key==='Escape')renderMenu();});
    inp.addEventListener('blur',done);
  }
});
$('saveList').addEventListener('change',e=>{
  if(e.target.dataset.a!=='sel')return;
  const id=e.target.closest('.card').dataset.id;
  e.target.checked?selSlots.add(id):selSlots.delete(id);renderMenu();
});
$('mDelSel').addEventListener('click',e=>{
  const ids=[...selSlots];
  arm('delsel',e.target,'Click again to delete '+ids.length,()=>{deleteSlots(ids);selSlots.clear();renderMenu();toast('Deleted '+ids.length+' save(s)');});
});
$('mNew').addEventListener('click',()=>{$('mNewForm').classList.toggle('show');$('mName').focus();$('mName').select();});
$('mCancel').addEventListener('click',()=>$('mNewForm').classList.remove('show'));
$('mCreate').addEventListener('click',()=>{
  const name=$('mName').value.trim()||'My railway';$('mNewForm').classList.remove('show');
  newSave(name,$('mTpl').value);
});
$('mName').addEventListener('keydown',e=>{if(e.key==='Enter')$('mCreate').click();});
$('mContinue').addEventListener('click',()=>{const id=STORE.last();if(id)openSlot(id);});
$('mBack').addEventListener('click',hideMenu);
$('mImport').addEventListener('click',()=>$('fileIn').click());
window.addEventListener('beforeunload',()=>saveCurrent(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveCurrent(true);});
// carry over a layout saved by the first version, if any
(function migrate(){
  try{
    const old=localStorage.getItem('railsim.layout.v1');
    if(old&&!STORE.index().length){
      const o=JSON.parse(old),id=newId();
      if(STORE.write(id,o))STORE.setIndex([{id,name:'Quick save (old)',updated:Date.now(),pieces:(o.pieces||[]).length,trains:(o.trains||[]).length,thumb:''}]);
    }
  }catch(e){}
})();

/* =====================================================================
   12. MAIN LOOP & BOOT
   ===================================================================== */
let lastTs=0,uiAcc=0;
function frame(ts){
  const fdt=Math.min(0.1,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
  if(!sim.paused){
    sim.acc+=fdt*sim.speed;let n=0;
    while(sim.acc>=1/60&&n<30){simStep(1/60);sim.acc-=1/60;n++;}
    if(n>=30)sim.acc=0;
  }else for(const s of W.signals)s.red=sigRed(s,null);
  for(const s of W.signals){
    if(s.red===undefined)s.red=true;
    s.lamp+=((s.red?0:1)-s.lamp)*Math.min(1,fdt*7);
  }
  for(const p of W.pieces)if(p.turnout)p.blade+=(p.state-p.blade)*Math.min(1,fdt*9);
  W.crashes=W.crashes.filter(c=>c.age<600);
  sim.nightV+=(sim.night-sim.nightV)*Math.min(1,fdt*2);
  updateParticles(fdt*(sim.paused?0:1));sndUpdate(fdt);
  const ft=W.trains.find(t=>t.follow&&sim.sel&&sim.sel.type==='train'&&sim.sel.id===t.id);
  if(ft&&ft.poses.length){const k=Math.min(1,fdt*4),p=ft.poses[0];cam.x+=(p.x-cam.x)*k;cam.y+=(p.y-cam.y)*k;}
  render(ts);
  uiAcc+=fdt;if(uiAcc>0.16){uiAcc=0;ui.tick();}
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{resize();});
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
if('ResizeObserver' in window)new ResizeObserver(()=>resize()).observe(cvs.parentElement);
document.addEventListener('visibilitychange',()=>{lastTs=performance.now();});

resize();buildHelp();ui.setTool('select');ui.setSpeed(1);
loadExample('oval',true);
showMenu();
requestAnimationFrame(t=>{lastTs=t;frame(t);});

</script>
