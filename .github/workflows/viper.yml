name: VIPER build & test

on:
  push:
    paths: ['viper/**', '.github/workflows/viper.yml']
  pull_request:
    paths: ['viper/**', '.github/workflows/viper.yml']
  workflow_dispatch:

jobs:
  desktop-windows:
    name: Desktop (Windows) — tests + installer
    runs-on: windows-latest
    defaults: { run: { working-directory: viper/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Unit + integration tests
        run: npm test
      - name: Electron smoke test (real window)
        continue-on-error: true
        run: |
          npm i --no-save playwright-core@1.63.0
          npm run test:electron
      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Silent install check
        shell: pwsh
        run: |
          Start-Process -FilePath (Get-ChildItem dist\VIPER-Setup-*.exe).FullName -ArgumentList '/S' -Wait
          if (!(Test-Path "$env:LOCALAPPDATA\Programs\VIPER\VIPER.exe")) { throw 'VIPER.exe not installed' }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\VIPER.lnk")) { throw 'Start menu shortcut missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: VIPER-Setup
          path: |
            viper/desktop/dist/VIPER-Setup-*.exe
            viper/desktop/dist/VIPER-Setup-*.exe.blockmap
            viper/desktop/dist/latest.yml

  android:
    name: VIPER Mobile APK
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: viper/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK packages (preinstalled SDK on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: VIPER-Mobile, path: 'viper/mobile/app/build/outputs/apk/**/*.apk' }

  release:
    name: Publish download (GitHub Release)
    needs: [desktop-windows, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          mkdir -p out
          cp artifacts/VIPER-Setup/* out/
          cp artifacts/VIPER-Mobile/debug/app-debug.apk out/VIPER-Mobile.apk
          VERSION=$(grep -oE 'VIPER-Setup-[0-9.]+\.exe$' <<< "$(ls out)" | head -1 | sed -E 's/VIPER-Setup-(.*)\.exe/\1/')
          TAG="v${VERSION}"
          NOTES="VIPER ${VERSION} for Windows 10/11 and VIPER Mobile for Android. Unsigned build: Windows/browsers may warn; choose Keep / More info -> Run anyway. Built from ${SHA}."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --target "$SHA" --notes "$NOTES" --latest
            gh release upload "$TAG" out/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" out/* --repo "$REPO" --target "$SHA" --title "VIPER ${VERSION}" --notes "$NOTES" --latest
          fi
