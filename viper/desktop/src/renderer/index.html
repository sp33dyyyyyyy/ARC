<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIPER</title>
<link rel="stylesheet" href="/css/viper.css">
<link rel="icon" href="/assets/viper.svg">
</head>
<body>
<header class="titlebar">
  <div class="brand"><img src="/assets/viper.svg" width="18" height="18" alt=""> VIPER</div>
  <div class="crumbs" id="crumbs"></div>
  <div class="spacer"></div>
  <button class="tb-pill" id="mic-toggle" title="Microphone (privacy switch)"></button>
  <button class="tb-pill" id="hud-btn" title="Floating HUD (global shortcut)">HUD</button>
  <div id="win-controls" class="row" style="gap:0"></div>
</header>
<div class="shell" id="shell">
  <nav class="side" id="nav" aria-label="Modes"></nav>
  <main class="stage"><div class="view" id="view"></div></main>
  <aside class="rail" id="rail" aria-label="Status"></aside>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
